<!DOCTYPE html>
<html>
<head>
<title>My Wishlist - HerMarket</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
}

.header{
    background:#111827;
    color:white;
    padding:22px 40px;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    background:white;
    padding:18px;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:260px;
    object-fit:contain;
    background:#f9fafb;
    border-radius:14px;
    padding:10px;
}
.price{
    color:#2563eb;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:10px;
    padding:10px 14px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:#2563eb;
    font-weight:600;
}

.remove{
    background:#ef4444;
}

.cart{
    background:#10b981;
}
</style>
</head>

<body>

<div class="header">
    <h2>❤️ HerMarket - My Wishlist</h2>
</div>

<div class="container">

<h1>Saved Products</h1>

<div class="grid">

{% for item in wishlist_items %}

<div class="card">

    {% if item.image %}
    <img src="{{ url_for('static', filename='uploads/' + item.image) }}">
    {% endif %}

    <h3>{{ item.title }}</h3>
    <p>{{ item.category }}</p>
    <p class="price">₹{{ item.price }}</p>

    <a href="/product/{{ item.product_id }}" class="btn">
        View
    </a>

    <a href="/add-to-cart/{{ item.product_id }}" class="btn cart">
        Add to Cart
    </a>

    <a href="/remove-wishlist/{{ item.wishlist_id }}" class="btn remove">
        Remove
    </a>

</div>

{% endfor %}

</div>

<a href="/customer" class="btn">
    ← Back to Shopping
</a>

</div>

</body>
</html>
